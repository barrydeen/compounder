name: CI

# The app is still in development, so this is deliberately minimal: one fast
# job that catches compile, analysis and test regressions. It reports status
# only — main accepts direct pushes and nothing here is required to merge.
# Release signing and packaging live in release.yml, which runs on tags.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so CI and local builds agree. Bump deliberately, in its own PR.
  FLUTTER_VERSION: "3.47.4"

jobs:
  check:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        # Required before formatting: dart format picks its style from the
        # package's declared language version in .dart_tool/package_config.json.
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        # The DST regression guards (test/dst_day_windows_test.dart,
        # test/digest_dst_test.dart) assert on ambient-zone DST transitions and
        # fail loudly rather than passing vacuously when the runner has none.
        # GitHub's ubuntu runner is UTC, so pin the zone.
        env:
          TZ: America/New_York
        run: flutter test
